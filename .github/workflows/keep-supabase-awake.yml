name: Keep Supabase Awake

on:
  schedule:
    # Runs every 5 days at 04:00 UTC
    - cron: "0 4 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_KEY in repository secrets."
            exit 1
          fi
          curl -fsS -m 15 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/trips?select=id&limit=1" > /dev/null
          echo "Supabase ping succeeded."
